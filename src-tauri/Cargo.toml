[package]
name = "direct-file-transfer"
version = "1.0.1"
description = "Direct File Transfer"
authors = ["Wong Teck Han"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tauri_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actix-web = "4.14.0"
tokio = { version = "1.52.3", features = ["sync", "signal"] }
uuid = { version = "1.23.5", features = ["v4"] }
lazy_static = "1.5.0"
regex = "1.13.0"
# write-only usage with `CompressionMethod::Stored`; `time` keeps real modification
# timestamps in zip entry metadata
zip = { version = "8.6.0", default-features = false, features = ["time"] }
local-ip-address = "0.6.13"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
actix-files = "0.6.10"
actix-multipart = "0.8.0"
actix-cors = "0.7.1"
actix-web-lab = "0.26.0"
parking_lot = "0.12.5"
tokio-stream = "0.1.18"
public-ip = "0.2.2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
